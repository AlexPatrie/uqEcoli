[project]
name = "uqEcoli"
version = "0.0.1"
description = "uqEcoli"
authors = [{ name = "Alex Patrie", email = "alexanderpatrie@gmail.com" }]
requires-python = ">=3.12.9"
readme = "README.md"
dependencies = [
    "polars>=1.38.1",
    "pydmd>=2025.8.1",
    "pytuq>=1.0.0",
    "ray[data,train,tune]>=2.54.0",
    "salib>=1.5.2",
    "sobol>=0.9",
    "typer>=0.24.1",
    "uqpy>=4.1.6",
]

[tool.hatch.build.targets.sdist]
include = [
    "uq",
    "tests"
]

[tool.hatch.build.targets.wheel]
include = [
    "uq",
    "tests"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "deptry>=0.24.0",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "tox>=4.49.0",
]
docs = [
    "sphinx>=9.1.0",
    "sphinx-autodoc-typehints>=3.9.8",
    "sphinx-rtd-theme>=3.1.0",
]

[tool.uv]
default-groups = [
    "dev",
    "docs"
]
