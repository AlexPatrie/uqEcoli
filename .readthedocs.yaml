# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
#
# The source repo is private; the rendered docs are public.
# RTD builds only the Sphinx docs — it does NOT install the full package
# (vEcoli, PyTUQ, etc. are not available on RTD).  Autodoc is configured
# with autodoc_mock_imports to handle missing dependencies gracefully.

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py

python:
  install:
    - requirements: docs/requirements.txt
